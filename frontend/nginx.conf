server {
    listen 80;
    server_name _;

    location /claude-usage-dashboard/ {
        alias /usr/share/nginx/html/claude-usage-dashboard/;
        index index.html;
        try_files $uri $uri/ $uri.html /claude-usage-dashboard/index.html;
    }

    location = / {
        return 301 /claude-usage-dashboard/;
    }
}
